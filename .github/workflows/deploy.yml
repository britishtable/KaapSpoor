name: Deploy app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Fetch map tiles and fonts
        run: |
          mkdir -p static/tiles
          gh release download "$TILES_TAG" --pattern '*.pmtiles' --dir static/tiles --clobber
          gh release download "$TILES_TAG" --pattern 'fonts.tar.gz' --dir static --clobber
          tar xzf static/fonts.tar.gz -C static && rm static/fonts.tar.gz
          # Presence is not validity: a truncated or half-uploaded asset still
          # exists. Assert a size floor per archive, and that glyphs actually
          # landed, so a corrupt download fails here rather than deploying a
          # blank map — the same silent-failure class as the maplibre worker 404.
          test "$(stat -c%s static/tiles/trails.pmtiles)"   -gt 20000000
          test "$(stat -c%s static/tiles/contours.pmtiles)" -gt 50000000
          test "$(find static/fonts -name '*.pbf' | wc -l)" -gt 100
          ls -la static/tiles
          find static/fonts -name '*.pbf' | wc -l
        env:
          GH_TOKEN: ${{ github.token }}
          TILES_TAG: tiles-v1
      # e2e is the only thing that proves the map works in a real browser
      # (npm test above is jsdom, no WebGL). It runs after the tiles/fonts are
      # in place — its own webServer builds the site same as the deploy build
      # below — and twice: once at base '' and once at BASE_PATH=/KaapSpoor
      # (see playwright.subpath.config.ts), which is what production actually
      # serves under. Every URL this branch fixed (the maplibre worker,
      # pmtiles, fonts, in-app links) was base-path dependent, so only testing
      # base '' would let that exact class of bug back through.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          BASE_PATH: /KaapSpoor
      - run: node scripts/check-size.mjs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build
  # tools/geocode decides which of the 184 routes get a coordinate and how well
  # each one is known. Its tests are what hold the honesty invariant up — that a
  # coordinate never exists without a provenance source, and that an area-level
  # guess can never present itself as a surveyed position. They run as their own
  # job rather than a step in `build` so a Python failure reads as a Python
  # failure, and they gate `deploy` because publishing a map whose location
  # tooling is broken is exactly what this is meant to prevent.
  #
  # Deliberately NOT checked here: whether data/route-locations.json still
  # matches what the tool would regenerate. CI has no OSM extract, so it can
  # only take the CLI's degraded path (no osm-match tier); once the artifact is
  # generated locally *with* the extract, a re-run here would differ for that
  # reason alone and the check would fail for being right rather than wrong.
  geocode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/geocode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/geocode/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  deploy:
    needs: [build, geocode]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
