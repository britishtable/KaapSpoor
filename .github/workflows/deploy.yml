name: Deploy app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Fetch map tiles and fonts
        run: |
          mkdir -p static/tiles
          gh release download tiles-v1 --pattern '*.pmtiles' --dir static/tiles --clobber
          gh release download tiles-v1 --pattern 'fonts.tar.gz' --dir static --clobber
          tar xzf static/fonts.tar.gz -C static && rm static/fonts.tar.gz
          ls -la static/tiles static/fonts | head -20
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
        env:
          BASE_PATH: /KaapSpoor
      - run: node scripts/check-size.mjs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
